    <title>Gym Plan - 健身记录</title>
    <script type="module" crossorigin src="/gym-plan/assets/index-DRf70rOQ.js"></script>
    <link rel="stylesheet" crossorigin href="/gym-plan/assets/index-COfySkI_.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var sy = 0;
        document.addEventListener('touchstart', function(e) { sy = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchmove', function(e) {
          var dy = e.touches[0].clientY - sy;
          if (dy > 5) {
            var el = e.target;
            while (el && el !== document.body) {
              if (el.scrollTop > 0) return;
              el = el.parentElement;
            }
            e.preventDefault();
          }
        }, { passive: false });
      })();
    </script>
  </body>
